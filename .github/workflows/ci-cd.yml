name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Type check
        run: npm run type-check
        
      # - name: Run tests
      #   run: npm test
        
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
  docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy:
    name: Deploy to Yandex Cloud
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Добавляем шаг для отладки
      - name: Debug environment
        run: |
          echo "GitHub SHA: ${{ github.sha }}"
          echo "GitHub Repository: ${{ github.repository }}"
          echo "PATH: $PATH"
        
      # Исправленная установка Yandex Cloud CLI
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
      
      # Используем shell для запуска следующих шагов
      - name: Setup shell
        run: |
          echo "export PATH=$HOME/yandex-cloud/bin:$PATH" >> $GITHUB_ENV
      
      # Проверяем установку CLI
      - name: Verify YC installation
        run: |
          which yc || echo "YC not found in PATH"
          $HOME/yandex-cloud/bin/yc version
          
      # Создаем файл с ключом сервисного аккаунта
      - name: Setup service account key
        run: |
          echo '${{ secrets.YC_KEY_JSON }}' > sa-key.json
          
      # Исправленная конфигурация Yandex Cloud с использованием ключа сервисного аккаунта
      - name: Configure Yandex Cloud
        run: |
          $HOME/yandex-cloud/bin/yc config profile create default
          $HOME/yandex-cloud/bin/yc config set service-account-key sa-key.json
          $HOME/yandex-cloud/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          

          
      # Развертывание в Yandex Cloud Serverless Containers
      - name: Deploy to Yandex Cloud Serverless Containers
        run: |
          $HOME/yandex-cloud/bin/yc serverless container revision deploy \
            --container-name web3-comparison \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --cores 1 \
            --memory 1GB \
            --concurrency 10 \
            --execution-timeout 30s \
            --service-account-id ${{ secrets.YC_SERVICE_ACCOUNT_ID }} \
            --environment PORT=3000,NODE_ENV=production,APP_VERSION=${{ secrets.APP_VERSION }},DEPLOYMENT_ID=${{ github.sha }}
            
      # Получаем URL развернутого приложения
      - name: Get deployment URL
        run: |
          echo "Deployment URL:"
          $HOME/yandex-cloud/bin/yc serverless container get --name web3-comparison --format json | jq -r '.domain'