name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Type check
        run: npm run type-check
        
      # - name: Run tests
      #   run: npm test
        
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
  docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Write service account key
        run: printf '%s' "${{ secrets.YC_KEY_JSON }}" > key.json

      - name: Install Yandex Cloud CLI
        run: |
          curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Auth in Yandex Cloud
        run: yc config set service-account-key key.json

      - name: Login to Yandex Container Registry
        run: yc container registry configure-docker

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            cr.yandex/crpqulehr82kua83ghmf/web3-comparison:latest
            cr.yandex/crpqulehr82kua83ghmf/web3-comparison:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy:
    name: Deploy to Yandex Cloud
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Write service account key
        run: echo "${{ secrets.YC_KEY_JSON }}" > key.json

      - name: Install Yandex Cloud CLI
        run: |
          curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
          
      - name: Auth in Yandex Cloud
        run: yc config set service-account-key key.json

      - name: Create container if not exists
        run: |
          yc serverless container get --name web3-comparison || \
          yc serverless container create --name web3-comparison
          
      - name: Deploy to Yandex Cloud Serverless Containers
        run: |
          yc serverless container revision deploy \
            --container-name web3-comparison \
            --image cr.yandex/crpqulehr82kua83ghmf/web3-comparison:${{ github.sha }} \
            --cores 1 \
            --memory 1GB \
            --concurrency 10 \
            --execution-timeout 30s \
            --service-account-id ${{ secrets.YC_SERVICE_ACCOUNT_ID }}

      - name: Debug YC_KEY_JSON
        run: |
          echo "==START=="
          echo "${{ secrets.YC_KEY_JSON }}"
          echo "==END=="
